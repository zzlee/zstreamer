stages:
  - build-and-test
  - deploy
  - release

# ── Job: Docker Build & Test (Core + V4L2) ───────────────────────────────────
# Simulates the GitHub Action docker-core-and-v4l2 environment using DinD.
test:docker-core:
  stage: build-and-test
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --target ci -t zstreamer:latest .
    - docker run --rm zstreamer:latest
    # Run integration/simulation tests if the runner environment permits (privileged access)
    - |
      if lsmod | grep -q "^v4l2loopback" || [ -c /dev/video10 ]; then
        echo "Running V4L2 Loopback Integration Test..."
        ./tests/run_integration_tests.sh
      else
        echo "Skipping loopback integration tests (v4l2loopback not available on runner host)"
      fi
    - |
      if lsmod | grep -q "^vivid" || [ -d /sys/class/video4linux ]; then
        echo "Running V4L2 DMABUF Simulation Test..."
        ./tests/run_v4l2_dmabuf_simulation.sh || echo "Vivid dmabuf test finished with skip or error"
      else
        echo "Skipping vivid simulation tests (vivid not available on runner host)"
      fi

# ── Job: Docker Build & Test (OpenGL/X11 headless) ───────────────────────────
# Simulates the GitHub Action docker-gl-sinks environment using DinD.
test:docker-gl:
  stage: build-and-test
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f docker/Dockerfile.gl --target ci -t zstreamer-build:gl .
    - docker run --rm zstreamer-build:gl

# ── Job: GitLab Pages ─────────────────────────────────────────────────────────
# Compiles doxygen docs and deploys them to GitLab Pages.
pages:
  stage: deploy
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends doxygen graphviz ca-certificates
  script:
    - doxygen Doxyfile
    - mkdir -p public
    - cp -r html/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Job: Package Release Artifacts (Docker) ────────────────────────────────────
# Builds inside Docker (deps stage), packages, and uploads to Package Registry.
package:release:
  stage: build-and-test
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - chmod +x scripts/*.sh
    - docker build -f docker/Dockerfile --target deps -t zstreamer-deps:$CI_COMMIT_SHA .
  script:
    - mkdir -p dist
    - |
      docker run --name zstreamer-pkg --rm \
        -e CI_API_V4_URL \
        -e CI_JOB_TOKEN \
        -e CI_PROJECT_ID \
        -e CI_COMMIT_TAG \
        -v $(pwd)/dist:/workspace/dist \
        zstreamer-deps:$CI_COMMIT_SHA \
        bash -c '
          set -e
          ./scripts/version.sh check-tag "${CI_COMMIT_TAG}"
          ./scripts/package.sh "${CI_COMMIT_TAG}"
          DEB_VERSION="${CI_COMMIT_TAG#v}"
          test -f "dist/zstreamer-${CI_COMMIT_TAG}-linux-x86_64.tar.gz"
          test -f "dist/zstreamer-elements-${CI_COMMIT_TAG}-linux-x86_64.tar.gz"
          test -f "dist/zstreamer-${CI_COMMIT_TAG}-linux-x86_64.zip"
          test -f "dist/zstreamer-elements-${CI_COMMIT_TAG}-linux-x86_64.zip"
          test -f "dist/zstreamer-dev_${DEB_VERSION}_amd64.deb"
          test -f "dist/zstreamer-elements-dev_${DEB_VERSION}_amd64.deb"
          for filepath in dist/*; do
            filename=$(basename "$filepath")
            echo "Uploading $filename to Package Registry..."
            curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
                 --upload-file "$filepath" \
                 "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zstreamer/${CI_COMMIT_TAG}/${filename}"
          done
        '
  artifacts:
    name: "zstreamer-dist-${CI_COMMIT_TAG}"
    paths:
      - dist/
    expire_in: 1 week

# ── Job: Create GitLab Release ────────────────────────────────────────────────
# Creates a formal GitLab Release linking to the registry packages.
release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package:release
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - echo "Publishing Release for ${CI_COMMIT_TAG}"
    - DEB_VERSION="${CI_COMMIT_TAG#v}"
    - |
      release-cli create --name "Release ${CI_COMMIT_TAG}" \
        --description "Automated release for version ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"zstreamer-${CI_COMMIT_TAG}-linux-x86_64.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zstreamer/${CI_COMMIT_TAG}/zstreamer-${CI_COMMIT_TAG}-linux-x86_64.tar.gz\"}" \
        --assets-link "{\"name\":\"zstreamer-elements-${CI_COMMIT_TAG}-linux-x86_64.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zstreamer/${CI_COMMIT_TAG}/zstreamer-elements-${CI_COMMIT_TAG}-linux-x86_64.tar.gz\"}" \
        --assets-link "{\"name\":\"zstreamer-${CI_COMMIT_TAG}-linux-x86_64.zip\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zstreamer/${CI_COMMIT_TAG}/zstreamer-${CI_COMMIT_TAG}-linux-x86_64.zip\"}" \
        --assets-link "{\"name\":\"zstreamer-elements-${CI_COMMIT_TAG}-linux-x86_64.zip\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zstreamer/${CI_COMMIT_TAG}/zstreamer-elements-${CI_COMMIT_TAG}-linux-x86_64.zip\"}" \
        --assets-link "{\"name\":\"zstreamer-dev_${DEB_VERSION}_amd64.deb\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zstreamer/${CI_COMMIT_TAG}/zstreamer-dev_${DEB_VERSION}_amd64.deb\"}" \
        --assets-link "{\"name\":\"zstreamer-elements-dev_${DEB_VERSION}_amd64.deb\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zstreamer/${CI_COMMIT_TAG}/zstreamer-elements-dev_${DEB_VERSION}_amd64.deb\"}"
