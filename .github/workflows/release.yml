name: Release zstreamer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag to release (must match VERSION, e.g., v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release Packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Verify Release Version
        run: ./scripts/version.sh check-tag "${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker deps Image
        run: |
          docker build -f docker/Dockerfile --target deps -t zstreamer-deps:${{ github.sha }} .

      - name: Build and Package in Docker
        run: |
          mkdir -p dist
          docker run --name zstreamer-pkg --rm \
            -e VERSION \
            -v $(pwd)/dist:/workspace/dist \
            zstreamer-deps:${{ github.sha }} \
            bash -c '
              set -euo pipefail
              bash tests/test_split_debug_symbols.sh
              ./scripts/package.sh "${VERSION}"
              DEB_VERSION="${VERSION#v}"
              ls -lh dist
              test -f "dist/zstreamer-${VERSION}-linux-x86_64.tar.gz"
              test -f "dist/zstreamer-debug-${VERSION}-linux-x86_64.tar.gz"
              test -f "dist/zstreamer-elements-${VERSION}-linux-x86_64.tar.gz"
              test -f "dist/zstreamer-${VERSION}-linux-x86_64.zip"
              test -f "dist/zstreamer-elements-${VERSION}-linux-x86_64.zip"
              test -f "dist/zstreamer-dev_${DEB_VERSION}_amd64.deb"
              test -f "dist/zstreamer-elements-dev_${DEB_VERSION}_amd64.deb"
            '

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: |
            dist/zstreamer-*.tar.gz
            dist/zstreamer-*.zip
            dist/zstreamer-dev_*.deb
            dist/zstreamer-elements-dev_*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
