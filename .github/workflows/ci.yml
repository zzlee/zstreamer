name: zstreamer CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-core-and-v4l2:
    name: Core Docker, CTest, V4L2 integration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host V4L2 Test Dependencies
        run: |
          sudo apt-get update
          # V4L2 integration is opportunistic: GitHub runner kernels do not
          # always publish linux-modules-extra for the running kernel.
          sudo apt-get install -y v4l2loopback-dkms dkms || \
            echo "V4L2 kernel package unavailable; integration tests will be skipped"

      - name: Load v4l2loopback Kernel Module
        run: |
          sudo modprobe v4l2loopback devices=1 video_nr=10 \
            card_label="ZStreamer-Loopback" exclusive_caps=1 || \
            echo "v4l2loopback unavailable; integration tests will be skipped"
          if [ -c /dev/video10 ]; then
            ls -lh /dev/video10
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Main CI Docker Image
        run: |
          docker build -f docker/Dockerfile --target ci -t zstreamer:latest .

      - name: Run Unit Tests (CTest) in Container
        run: |
          docker run --rm zstreamer:latest

      - name: Run V4L2 Loopback Integration Test
        if: ${{ hashFiles('tests/run_integration_tests.sh') != '' }}
        run: |
          if [ -c /dev/video10 ]; then
            ./tests/run_integration_tests.sh
          else
            echo "Skipping V4L2 loopback integration test (device unavailable)"
          fi

      - name: Run V4L2 DMABUF Simulation Test (vivid)
        run: |
          # The script itself skips when vivid/DMABUF support is unavailable;
          # do not make a hosted runner capability an unconditional CI gate.
          ./tests/run_v4l2_dmabuf_simulation.sh

  docker-gl-sinks:
    name: Headless OpenGL/X11 sink tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build GL CI Docker Image
        run: |
          docker build -f docker/Dockerfile.gl --target ci -t zstreamer-build:gl .

      - name: Run GL Sink and Compositor Tests
        run: |
          docker run --rm zstreamer-build:gl
