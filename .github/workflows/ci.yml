name: zstreamer CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-core-and-v4l2:
    name: Core Docker, CTest, V4L2 integration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host V4L2 Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) v4l2loopback-dkms dkms

      - name: Load v4l2loopback Kernel Module
        run: |
          sudo modprobe v4l2loopback devices=1 video_nr=10 card_label="ZStreamer-Loopback" exclusive_caps=1
          ls -lh /dev/video10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Main CI Docker Image
        run: |
          docker build --target ci -t zstreamer:latest .

      - name: Run Unit Tests (CTest) in Container
        run: |
          docker run --rm zstreamer:latest

      - name: Run V4L2 Loopback Integration Test
        run: |
          ./tests/run_integration_tests.sh

      - name: Run V4L2 DMABUF Simulation Test (vivid)
        run: |
          ./tests/run_v4l2_dmabuf_simulation.sh

  docker-gl-sinks:
    name: Headless OpenGL/X11 sink tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build GL CI Docker Image
        run: |
          docker build -f docker/Dockerfile.gl --target ci -t zstreamer-build:gl .

      - name: Run GL Sink and Compositor Tests
        run: |
          docker run --rm zstreamer-build:gl
